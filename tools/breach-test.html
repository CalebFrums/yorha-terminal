<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Drill Test</title>
<!-- Standalone harness for breach3d.js (not shipped). Query: ?theme=dark  ?q=low|high  ?stage=sweep|fortress|corridor -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: rgb(var(--paper)); font-family: "Bahnschrift Light", "Bahnschrift", "Segoe UI", sans-serif;
    background-image: linear-gradient(rgba(var(--ink), 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--ink), 0.06) 1px, transparent 1px);
    background-size: 40px 40px; }
  body.light { --ink: 78, 75, 66; --paper: 218, 212, 187; }
  body.dark { --ink: 218, 212, 187; --paper: 38, 37, 32; }
  .pview.game { position: absolute; inset: 0; }
  .pview.game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #bar { position: fixed; left: 8px; bottom: 8px; z-index: 5; font: 12px Consolas, monospace; color: rgb(var(--ink)); display: flex; gap: 6px; align-items: center; }
  #bar button { font: inherit; }
  #stats { position: fixed; right: 8px; bottom: 8px; z-index: 5; font: 11px Consolas, monospace; color: rgb(var(--ink)); white-space: pre; text-align: right; opacity: 0.8; }
</style>
</head>
<body class="light">
<div class="pview game"><canvas id="g"></canvas></div>
<div id="bar"><button data-theme="light">light</button><button data-theme="dark">dark</button><button id="hide">hide 2s</button><span id="log"></span></div>
<div id="stats"></div>
<script src="../breach3d.js"></script>
<script>
(function () {
  'use strict';
  const params = new URLSearchParams(location.search);
  const THEMES = {
    light: { ink: '78, 75, 66', paper: '218, 212, 187', accent: '185, 83, 59', dust: '255, 253, 242', hl: '#dad4bb' },
    dark: { ink: '218, 212, 187', paper: '38, 37, 32', accent: '217, 115, 90', dust: '218, 212, 187', hl: '#262520' }
  };
  let theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  let colors = THEMES[theme];
  document.body.className = theme;
  const dpr = () => Math.min(window.devicePixelRatio || 1, 2);
  function fit(c, maxW) {
    let k = dpr();
    if (maxW && c.clientWidth * k > maxW) k = maxW / c.clientWidth;
    const w = Math.max(1, Math.round(c.clientWidth * k)), h = Math.max(1, Math.round(c.clientHeight * k));
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }
  const log = document.getElementById('log');
  const api = {
    store: {
      get(k, d) { try { const v = localStorage.getItem('breachtest.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem('breachtest.' + k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
    },
    dpr: dpr,
    fit: fit,
    font: '"Bahnschrift Light", "Bahnschrift", "Segoe UI", sans-serif',
    colors: () => colors,
    bass: () => 0,
    unit: () => '2B',
    say: (kind, text) => { log.textContent = kind + ': ' + text; },
    quality: params.get('q') || '',
    debug: true
  };
  const game = window.YoRHaGames3D.breach(document.getElementById("g"), api);
  window.__breach = game;
  game.show();
  document.querySelectorAll('[data-theme]').forEach((b) => b.addEventListener('click', () => {
    theme = b.dataset.theme;
    colors = THEMES[theme];
    document.body.className = theme;
  }));
  document.getElementById('hide').addEventListener('click', () => { game.hide(); setTimeout(() => game.show(), 2000); });
  let last = performance.now(), t = 0, frames = 0, fpsT = 0, fps = 0;
  const stats = document.getElementById('stats');
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    t += dt;
    game.frame(dt, t);
    frames++;
    fpsT += dt;
    if (fpsT >= 0.5) {
      fps = Math.round(frames / fpsT);
      frames = 0;
      fpsT = 0;
      const i = game.debug.info();
      const mem = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB heap' : '';
      stats.textContent = fps + ' fps  ' + i.mode + ' ' + i.kind + ' ' + i.stage + '\n' +
        'scale ' + i.scale.toFixed(2) + ' ' + i.size.join('x') + (i.low ? ' LOW' : '') + '\n' +
        'calls ' + i.calls + '  tris ' + i.tris + '  geos ' + i.geos + '\n' +
        'bullets ' + i.bullets + '  shards ' + i.shards + '  ' + mem;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  if (params.get('stage')) {
    const want = params.get("stage");
    const wait = setInterval(() => { if (game.debug.info().ready) { clearInterval(wait); game.debug.stage(want); } }, 100);
  }
})();
</script>
</body>
</html>
